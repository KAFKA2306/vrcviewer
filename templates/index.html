<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VRChat Explorer</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background: #f5f5f5; color: #222; }
    .hero { max-width: 760px; margin: 20px auto 24px; text-align: center; }
    h1 { margin: 0 0 10px; }
    .hero p { margin: 0; color: #555; line-height: 1.6; }
    .tab-container, .filter-container { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
    .tab-btn, .filter-btn { padding: 9px 16px; background: #fff; border: 1px solid #ccc; border-radius: 20px; cursor: pointer; }
    .tab-btn.active, .filter-btn.active { background: #315f91; color: #fff; }
    button:focus-visible, input:focus-visible, a:focus-visible { outline: 3px solid #2563eb; outline-offset: 3px; }
    .search-container { max-width: 600px; margin: 0 auto 24px; }
    .search-container input { width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ccc; border-radius: 6px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .card { overflow: hidden; background: #fff; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,.1); }
    .image-container { position: relative; display: block; color: inherit; text-decoration: none; }
    .image { display: block; width: 100%; height: 200px; object-fit: cover; }
    .image-overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.55); color: #fff; opacity: 0; transition: opacity .2s; }
    .image-container:hover .image-overlay, .image-container:focus .image-overlay { opacity: 1; }
    .info { padding: 15px; }
    .name { font-weight: 700; margin-bottom: 8px; }
    .author { color: #666; font-size: 14px; }
    .id { color: #888; font-size: 12px; margin-top: 8px; overflow-wrap: anywhere; }
  </style>
</head>
<body>
  <header class="hero">
    <h1>VRChat Explorer</h1>
    <p>次に試すアバターや遊びに行くワールドを、名前・作者・カテゴリから探せます。気になるカードからVRChatの公式ページで確認できます。</p>
  </header>
  <div class="tab-container" role="tablist" aria-label="探す対象">
    <button class="tab-btn active" id="tab-avatars" type="button" role="tab" aria-selected="true" aria-controls="avatars" tabindex="0" data-tab="avatars">アバターを探す</button>
    <button class="tab-btn" id="tab-worlds" type="button" role="tab" aria-selected="false" aria-controls="worlds" tabindex="-1" data-tab="worlds">ワールドを探す</button>
  </div>

  <section id="avatars" class="tab-content active" role="tabpanel" aria-labelledby="tab-avatars">
    <div class="search-container"><input type="search" id="avatar-search" aria-label="アバターを名前または作者で検索" placeholder="アバター名やクリエイター名で検索..."></div>
    <div class="gallery">
{{AVATAR_CARDS}}
    </div>
  </section>

  <section id="worlds" class="tab-content" role="tabpanel" aria-labelledby="tab-worlds" hidden>
    <div class="search-container"><input type="search" id="world-search" aria-label="ワールドを名前または作者で検索" placeholder="ワールド名やクリエイター名で検索..."></div>
    <div class="filter-container">
      <button class="filter-btn active" type="button" data-filter="all">すべて</button>
{{WORLD_FILTERS}}
    </div>
    <div class="gallery">
{{WORLD_CARDS}}
    </div>
  </section>

  <script>
    const tabs = [...document.querySelectorAll('.tab-btn')];

    function activateTab(button) {
      tabs.forEach((item) => {
        const selected = item === button;
        item.classList.toggle('active', selected);
        item.setAttribute('aria-selected', String(selected));
        item.tabIndex = selected ? 0 : -1;
        const panel = document.getElementById(item.dataset.tab);
        panel.classList.toggle('active', selected);
        panel.hidden = !selected;
      });
    }

    tabs.forEach((button, index) => {
      button.addEventListener('click', () => activateTab(button));
      button.addEventListener('keydown', (event) => {
        if (!['ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(event.key)) return;
        event.preventDefault();
        let nextIndex = index;
        if (event.key === 'ArrowLeft') nextIndex = (index - 1 + tabs.length) % tabs.length;
        if (event.key === 'ArrowRight') nextIndex = (index + 1) % tabs.length;
        if (event.key === 'Home') nextIndex = 0;
        if (event.key === 'End') nextIndex = tabs.length - 1;
        activateTab(tabs[nextIndex]);
        tabs[nextIndex].focus();
      });
    });

    function bindSearch(inputId, selector) {
      document.getElementById(inputId).addEventListener('input', (event) => {
        const query = event.target.value.toLocaleLowerCase();
        document.querySelectorAll(selector).forEach((card) => {
          card.hidden = !(card.dataset.name.includes(query) || card.dataset.author.includes(query));
        });
      });
    }
    bindSearch('avatar-search', '.avatar-card');
    bindSearch('world-search', '.world-card');

    document.querySelectorAll('#worlds .filter-btn').forEach((button) => button.addEventListener('click', () => {
      document.querySelectorAll('#worlds .filter-btn').forEach((item) => item.classList.remove('active'));
      button.classList.add('active');
      document.querySelectorAll('.world-card').forEach((card) => {
        card.hidden = button.dataset.filter !== 'all' && card.dataset.category !== button.dataset.filter;
      });
    }));
  </script>
</body>
</html>
