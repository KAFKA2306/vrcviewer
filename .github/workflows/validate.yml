name: Validate generated gallery

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Refresh generated index on PR branch
        if: github.event_name == 'pull_request'
        run: |
          python -m vrcviewer.build
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "build: refresh generated gallery"
            git push
          fi
      - name: Verify generated index has no drift
        run: |
          set -o pipefail
          python -m vrcviewer.build --check 2>&1 | tee build-diagnostics.log
      - name: Upload build diagnostics
        if: always() && hashFiles('build-diagnostics.log') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gallery-build-diagnostics-${{ github.run_id }}
          path: build-diagnostics.log
          if-no-files-found: error
      - name: Upload build manifest
        if: always() && hashFiles('build-manifest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gallery-build-manifest-${{ github.run_id }}
          path: build-manifest.json
          if-no-files-found: error
